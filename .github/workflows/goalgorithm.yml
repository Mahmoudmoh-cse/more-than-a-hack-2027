name: Goalgorithm synthetic checks
on: [push, pull_request]
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-goalgorithm.txt
      - run: python -m pip install -r requirements-goalgorithm.txt
      - run: python -m pip check
      - run: python -X utf8 -m compileall -q goalgorithm tests run_goalgorithm.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 -m tests.compare_synthetic
      - run: python -X utf8 -m tests.smoke_full
